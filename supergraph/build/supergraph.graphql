type Query

type Mutation

"""Standard pagination metadata returned alongside list queries."""
type PageResult {
  """Number of items returned in the current page."""
  count: Int
  """Maximum number of items requested per page."""
  pageSize: Int
  """Zero-based page index of the current result set."""
  pageNumber: Int
  """Total number of items matching the query criteria across all pages."""
  totalCount: Int
  """Total number of pages calculated from totalCount and pageSize."""
  totalPages: Int
}

"""
Declarative authorization directive evaluated on field and object resolution.
Evaluates the caller's active Experience context against assigned permissions.
"""
directive @authorize(
  """
  Required permission strings when evaluated in the CUSTOMER experience context.
  """
  customer: [String!] = []
  """
  Required permission strings when evaluated in the OPERATIONS experience context.
  """
  operations: [String!] = []
) on OBJECT | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Federation entity key directive defining the primary key fields for an entity.
"""
directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

"""Unique identifier scalar (string or integer serialized as string)."""
scalar ID

"""ISO-8601 formatted datetime string (e.g. 2026-11-08T12:00:00Z)."""
scalar DateTime

"""ISO-8601 formatted date string (e.g. 2026-11-08)."""
scalar Date

"""24-hour time string (e.g. 14:30:00)."""
scalar Time

"""RFC 4122 compliant universally unique identifier (UUIDv4)."""
scalar UUID

"""Arbitrary JSON payload or object."""
scalar JSON

"""Sort order direction."""
enum SortOrder {
  ASC
  DESC
}

"""Standard pagination and sorting request parameters."""
input PageRequest {
  """Size of the page"""
  pageSize: Int
  """Zero index based page number"""
  pageNumber: Int
  """List of sort orders applied sequentially"""
  sort: [Sort!]
}

"""
A single sort criterion. Multiple criteria are passed as a list in
PageRequest.sort and applied in the order given.
"""
input Sort {
  orderBy: String
  order: SortOrder
}

extend type Query {
  """Retrieve a customer member profile by ID."""
  member(id: ID!): Member @authorize(customer: ["view.customer.member"], operations: ["view.operations.member"])
  """Paginated list of members filtered by organization or status."""
  members(filters: MemberFilters): MemberPage! @authorize(customer: ["view.customer.member"], operations: ["view.operations.member"])
}

extend type Mutation {
  """Update member personal profile details."""
  memberUpdate(id: ID!, input: MemberUpdateInput!): Member! @authorize(customer: ["update.customer.member"], operations: ["update.operations.member"])
}

"""Customer persona and profile entity."""
type Member @key(fields: "id") {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  phone: String
  country: String
  gender: String
  dateOfBirth: Date
  status: MemberStatus!
  roles: [Role!]!
  joinedAt: DateTime
}

type MemberPage {
  items: [Member!]!
  pageResult: PageResult
}

input MemberFilters {
  orgId: ID
  status: MemberStatus
  pageRequest: PageRequest
}

input MemberUpdateInput {
  firstName: String
  lastName: String
  phone: String
  country: String
  gender: String
  dateOfBirth: Date
}

enum MemberStatus {
  INDIVIDUAL
  ORG_ACTIVE
  ORG_SUSPENDED
  ORG_OFFBOARDED
}

extend type Query {
  """Retrieve an internal operations user by ID."""
  operator(id: ID!): Operator @authorize(operations: ["manage.operations.operator"])
  """Paginated list of internal operations teammates."""
  operators(filters: OperatorFilters): OperatorPage! @authorize(operations: ["manage.operations.operator"])
}

extend type Mutation {
  """Update internal operator status or department."""
  operatorUpdate(id: ID!, input: OperatorUpdateInput!): Operator! @authorize(operations: ["update.operations.operator"])
}

"""Internal operations teammate profile entity."""
type Operator @key(fields: "id") {
  id: ID!
  corporateEmail: String!
  firstName: String
  lastName: String
  department: String
  phone: String
  status: OperatorStatus!
  roles: [Role!]!
}

type OperatorPage {
  items: [Operator!]!
  pageResult: PageResult
}

input OperatorFilters {
  department: String
  status: OperatorStatus
  pageRequest: PageRequest
}

input OperatorUpdateInput {
  firstName: String
  lastName: String
  department: String
  status: OperatorStatus
}

enum OperatorStatus {
  ACTIVE
  SUSPENDED
  OFFBOARDED
}

extend type Member @key(fields: "id") {
  """
  The tenant organization to which this member belongs (null if in INDIVIDUAL mode).
  """
  organization: Organization
}

extend type Query {
  """Retrieve organization workspace details by ID."""
  organization(id: ID!): Organization @authorize(customer: ["view.customer.organization"], operations: ["view.operations.organization"])
  """Paginated list of organization workspaces."""
  organizations(status: OrganizationStatus, pageRequest: PageRequest): OrganizationPage! @authorize(operations: ["view.operations.organization"])
}

extend type Mutation {
  """Update tenant organization workspace settings."""
  organizationUpdate(id: ID!, input: OrganizationUpdateInput!): Organization! @authorize(customer: ["update.customer.organization"], operations: ["update.operations.organization"])
}

"""Tenant organization workspace entity."""
type Organization @key(fields: "id") {
  id: ID!
  name: String!
  slug: String!
  description: String
  status: OrganizationStatus!
  members: [Member!]!
}

type OrganizationPage {
  items: [Organization!]!
  pageResult: PageResult
}

type Role @key(fields: "id") {
  id: ID!
  name: String!
  description: String
  permissions: [String!]!
}

input OrganizationUpdateInput {
  name: String
  slug: String
  description: String
  status: OrganizationStatus
}

enum OrganizationStatus {
  ACTIVE
  INACTIVE
  DRAFT
  DELETED
}

extend type Query {
  """Retrieve security account status by user ID."""
  user(id: ID!): User @authorize(customer: ["view.customer.user"], operations: ["view.operations.user"])
  """Paginated list of security user accounts."""
  users(status: UserStatus, pageRequest: PageRequest): UserPage! @authorize(operations: ["view.operations.user"])
}

"""Security principal entity representing an authentication account."""
type User @key(fields: "id") {
  id: ID!
  email: String!
  status: UserStatus!
}

type UserPage {
  items: [User!]!
  pageResult: PageResult
}

enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  DELETED
}