"""
Declarative authorization directive evaluated on field and object resolution.
Evaluates the caller's active Experience context against assigned permissions.
"""
directive @authorize(
  """
  Required permission strings when evaluated in the CUSTOMER experience context.
  """
  customer: [String!] = []

  """
  Required permission strings when evaluated in the OPERATIONS experience context.
  """
  operations: [String!] = []
) on OBJECT | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Federation entity key directive defining the primary key fields for an entity.
"""
directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

type Query {
  """Retrieve a customer member profile by ID."""
  member(id: ID!): Member

  """Paginated list of members filtered by organization or status."""
  members(orgId: ID, status: MemberStatus, pageRequest: PageRequest): MemberConnection!

  """Retrieve a workspace join request or invitation by ID."""
  joinRequest(id: ID!): JoinRequest

  """
  Paginated list of join requests and invitations for an organization workspace.
  """
  joinRequests(orgId: ID!, status: JoinRequestStatus, type: JoinRequestType, pageRequest: PageRequest): JoinRequestConnection!

  """Retrieve an internal operations user by ID."""
  operator(id: ID!): Operator

  """Paginated list of internal operations teammates."""
  operators(department: String, status: OperatorStatus, pageRequest: PageRequest): OperatorConnection!

  """Platform telemetry, onboarding queues, and system health status."""
  operationsDashboard: OperationsDashboard!

  """Retrieve organization workspace details by ID or slug."""
  organization(id: ID, slug: String): Organization

  """Paginated list of organization workspaces."""
  organizations(status: OrganizationStatus, pageRequest: PageRequest): OrganizationConnection!

  """Retrieve a role by ID."""
  role(id: ID!): Role

  """List roles catalog."""
  roles: [Role!]!

  """Retrieve security account status by user ID."""
  user(id: ID!): User

  """Paginated list of security user accounts."""
  users(status: UserStatus, pageRequest: PageRequest): UserConnection!
}

type Mutation {
  """Update member personal profile details."""
  memberUpdate(id: ID!, input: MemberUpdateInput!): Member!

  """Invite a new user to join an organization workspace as a member."""
  memberInvite(input: MemberInviteInput!): JoinRequest!

  """Review (approve or reject) a member join request or invitation."""
  joinRequestReview(id: ID!, input: JoinRequestReviewInput!): JoinRequest!

  """Create a new internal operator account."""
  operatorCreate(input: OperatorCreateInput!): Operator!

  """Update internal operator status or department."""
  operatorUpdate(id: ID!, input: OperatorUpdateInput!): Operator!

  """Create a new tenant organization workspace."""
  organizationCreate(input: OrganizationCreateInput!): Organization!

  """Update tenant organization workspace settings."""
  organizationUpdate(id: ID!, input: OrganizationUpdateInput!): Organization!
}

"""Standard pagination metadata returned alongside list queries."""
type PageResult {
  """Number of items returned in the current page."""
  count: Int

  """Maximum number of items requested per page."""
  pageSize: Int

  """Zero-based page index of the current result set."""
  pageNumber: Int

  """Total number of items matching the query criteria across all pages."""
  totalCount: Int

  """Total number of pages calculated from totalCount and pageSize."""
  totalPages: Int
}

"""ISO-8601 formatted datetime string (e.g. 2026-11-08T12:00:00Z)."""
scalar DateTime

"""ISO-8601 formatted date string (e.g. 2026-11-08)."""
scalar Date

"""24-hour time string (e.g. 14:30:00)."""
scalar Time

"""RFC 4122 compliant universally unique identifier (UUIDv4)."""
scalar UUID

"""Arbitrary JSON payload or object."""
scalar JSON

"""Sort order direction."""
enum SortOrder {
  ASC
  DESC
}

"""Standard pagination and sorting request parameters."""
input PageRequest {
  """Size of the page"""
  pageSize: Int

  """Zero index based page number"""
  pageNumber: Int

  """List of sort orders applied sequentially"""
  sort: [Sort!]
}

"""
A single sort criterion. Multiple criteria are passed as a list in
PageRequest.sort and applied in the order given.
"""
input Sort {
  orderBy: String
  order: SortOrder
}

"""Customer persona and profile entity."""
type Member {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  phone: String
  country: String
  gender: String
  dateOfBirth: Date
  status: MemberStatus!
  roles: [Role!]!
  joinedAt: DateTime

  """
  The tenant organization to which this member belongs (null if in INDIVIDUAL mode).
  """
  organization: Organization
}

type MemberConnection {
  items: [Member!]!
  pageResult: PageResult
}

input MemberUpdateInput {
  firstName: String
  lastName: String
  phone: String
  country: String
  gender: String
  dateOfBirth: Date
}

input MemberInviteInput {
  orgId: ID!
  email: String!
  roleIds: [ID!]!
  message: String
}

input JoinRequestReviewInput {
  decision: JoinRequestDecision!
  message: String
}

type JoinRequest {
  id: ID!
  orgId: ID!
  memberId: ID
  type: JoinRequestType!
  status: JoinRequestStatus!
  message: String
  reviewedAt: DateTime
}

type JoinRequestConnection {
  items: [JoinRequest!]!
  pageResult: PageResult
}

enum MemberStatus {
  INDIVIDUAL
  ORG_ACTIVE
  ORG_SUSPENDED
  ORG_OFFBOARDED
}

enum JoinRequestType {
  INVITATION
  APPLICATION
}

enum JoinRequestStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
  EXPIRED
}

enum JoinRequestDecision {
  APPROVE
  REJECT
}

"""Internal operations teammate profile entity."""
type Operator {
  id: ID!
  corporateEmail: String!
  firstName: String
  lastName: String
  department: String
  phone: String
  status: OperatorStatus!
  roles: [Role!]!
}

type OperatorConnection {
  items: [Operator!]!
  pageResult: PageResult
}

type OperationsDashboard {
  activeOrganizationsCount: Int!
  pendingJoinRequestsCount: Int!
  totalConnectedDatasources: Int!
  activeAgentWorkflowsCount: Int!
}

input OperatorCreateInput {
  corporateEmail: String!
  firstName: String!
  lastName: String!
  department: String
  roleIds: [ID!]!
}

input OperatorUpdateInput {
  firstName: String
  lastName: String
  department: String
  status: OperatorStatus
}

enum OperatorStatus {
  ACTIVE
  SUSPENDED
  OFFBOARDED
}

"""Tenant organization workspace entity."""
type Organization {
  id: ID!
  name: String!
  slug: String!
  description: String
  status: OrganizationStatus!
  members: [Member!]!
}

type OrganizationConnection {
  items: [Organization!]!
  pageResult: PageResult
}

type Role {
  id: ID!
  name: String!
  description: String
  permissions: [String!]!
}

input OrganizationCreateInput {
  name: String!
  slug: String!
  description: String
}

input OrganizationUpdateInput {
  name: String
  slug: String
  description: String
  status: OrganizationStatus
}

enum OrganizationStatus {
  ACTIVE
  INACTIVE
  DRAFT
  DELETED
}

"""Security principal entity representing an authentication account."""
type User {
  id: ID!
  email: String!
  status: UserStatus!
}

type UserConnection {
  items: [User!]!
  pageResult: PageResult
}

enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  DELETED
}