[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-graph-registry"
version = "1.0.1"
description = "Centralized GraphQL schema registry for Quest Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quest Engine Team" }
]
dependencies = [
    "graphql-core>=3.2.0",
    "click>=8.1.0",
]

[project.scripts]
graph-cli = "registry.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["registry"]

[tool.hatch.build.targets.wheel.force-include]
"subgraph" = "registry/subgraph"
"supergraph" = "registry/supergraph"
