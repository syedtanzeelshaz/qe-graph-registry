[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-graph-registry"
version = "1.0.1"
description = "Centralized GraphQL schema registry for Quest Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quest Engine Team" }
]
dependencies = [
    "graphql-core>=3.2.0",
    "click>=8.1.0",
]

[project.scripts]
graph-cli = "questengine.registry.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["questengine"]

[tool.hatch.build.targets.wheel.force-include]
"subgraph" = "questengine/registry/subgraph"
"supergraph/build/supergraph.graphql" = "questengine/registry/schema/supergraph.graphql"
"supergraph/build/supergraph-api.json" = "questengine/registry/schema/supergraph-api.json"
"supergraph/build/constants.py" = "questengine/registry/constants.py"
"supergraph/build/types" = "questengine/registry/types"
