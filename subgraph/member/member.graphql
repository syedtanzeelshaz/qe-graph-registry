extend type Query {
    """Retrieve a customer member profile by ID."""
    member(id: ID!): Member @authorize(customer: ["view.customer.member.profile"], operations: ["view.operations.members"])

    """Paginated list of members filtered by organization or status."""
    members(filters: MemberFilters): MemberPage! @authorize(customer: ["view.customer.members"], operations: ["view.operations.members"])
}

extend type Mutation {
    """Update member personal profile details."""
    memberUpdate(id: ID!, input: MemberUpdateInput!): Member! @authorize(customer: ["update.customer.member.profile"], operations: ["update.operations.members"])
}

"""
Customer persona and profile entity.
"""
type Member @key(fields: "id") {
    id: ID!
    email: String!
    firstName: String
    lastName: String
    phone: String
    country: String
    gender: String
    dateOfBirth: Date
    status: MemberStatus!
    roles: [Role!]!
    joinedAt: DateTime
}

type MemberPage {
    items: [Member!]!
    pageResult: PageResult
}

input MemberFilters {
    orgId: ID
    status: MemberStatus
    pageRequest: PageRequest
}

input MemberUpdateInput {
    firstName: String
    lastName: String
    phone: String
    country: String
    gender: String
    dateOfBirth: Date
}

enum MemberStatus {
    INDIVIDUAL
    ORG_ACTIVE
    ORG_SUSPENDED
    ORG_OFFBOARDED
}
