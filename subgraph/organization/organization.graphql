extend type Query {
    """Retrieve organization workspace details by ID."""
    organization(id: ID!): Organization @authorize(customer: ["view.customer.organization"], operations: ["view.operations.organization"])

    """Paginated list of organization workspaces."""
    organizations(status: OrganizationStatus, pageRequest: PageRequest): OrganizationPage! @authorize(operations: ["view.operations.organization"])
}

extend type Mutation {
    """Update tenant organization workspace settings."""
    organizationUpdate(id: ID!, input: OrganizationUpdateInput!): Organization! @authorize(customer: ["update.customer.organization"], operations: ["update.operations.organization"])
}

"""
Tenant organization workspace entity.
"""
type Organization @key(fields: "id") {
    id: ID!
    name: String!
    slug: String!
    description: String
    status: OrganizationStatus!
    members: [Member!]!
}

type OrganizationPage {
    items: [Organization!]!
    pageResult: PageResult
}

type Role @key(fields: "id") {
    id: ID!
    name: String!
    description: String
    permissions: [String!]!
}

input OrganizationUpdateInput {
    name: String
    slug: String
    description: String
    status: OrganizationStatus
}

enum OrganizationStatus {
    ACTIVE
    INACTIVE
    DRAFT
    DELETED
}
