"""
Declarative authorization directive evaluated on field and object resolution.
Evaluates the caller's active Experience context against assigned permissions.
"""
directive @authorize(
    """
    Required permission strings when evaluated in the CUSTOMER experience context.
    """
    customer: [String!] = []

    """
    Required permission strings when evaluated in the OPERATIONS experience context.
    """
    operations: [String!] = []
) on OBJECT | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Federation entity key directive defining the primary key fields for an entity.
"""
directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE
